run: uvicorn app.main:app --reload
seed: python scripts/seed_plans.py
test: pytest
base_url: http://127.0.0.1:8000

endpoints:

* GET /
* GET /db-test
* GET /plans/{plan_id}
* POST /subscriptions
* GET /subscriptions/{subscription_id}
* GET /subscriptions
* POST /usage/
* GET /usage/{usage_event_id}
* GET /usage/tenant/{tenant_id}
* GET /usage/tenant/{tenant_id}/total
* POST /generate/
* POST /payments/initialize
* POST /payments/verify
* POST /webhooks/paystack
